name: Nohello KPM ABI compatibility CI

on:
  push:
    branches:
      - fix/nohello-legacy-kpm-abi
      - main
      - security/ap-upstream-kpm-data-hygiene
    paths:
      - 'kernel/**'
      - 'checks/**'
      - '.github/workflows/nohello-abi-ci.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-kpimg:
    name: Build patched KPIMG and verify legacy export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Security regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 checks/check_kpm_data_hygiene.py
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -o /tmp/test_kpm_secure_wipe checks/test_kpm_secure_wipe.c
          /tmp/test_kpm_secure_wipe

      - name: Install AArch64 bare-metal toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/arm-toolchain.tar.xz \
            https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          mkdir -p /tmp/kp-toolchain
          tar -xJf /tmp/arm-toolchain.tar.xz -C /tmp/kp-toolchain --strip-components=1
          echo "TARGET_COMPILE=/tmp/kp-toolchain/bin/aarch64-none-elf-" >> "$GITHUB_ENV"

      - name: Build kernel image
        run: |
          set -euo pipefail
          make -C kernel
          test -s kernel/kpimg
          test -s kernel/kpimg.elf

      - name: Verify opt-in ABI metadata and legacy fallback with real KPM files
        shell: bash
        run: |
          set -euo pipefail
          make -C kpms/demo-hello
          cmake -S tools -B /tmp/kptools-abi -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/kptools-abi --parallel 2
          /tmp/kptools-abi/kptools -l -M kpms/demo-hello/hello.kpm | tee /tmp/kpm-modern.txt
          grep -Fxq 'abi=1' /tmp/kpm-modern.txt
          # Compile the same sample without optional ABI metadata. It must
          # still be accepted and must not acquire a fabricated ABI value.
          sed '/KPM_ABI("1");/d' kpms/demo-hello/hello.c > kpms/demo-hello/legacy-abi-test.c
          (
            cd kpms/demo-hello
            ${TARGET_COMPILE}gcc -O2 -Thello.lds -c \
              -I../../kernel -I../../kernel/include -I../../kernel/patch/include \
              -I../../kernel/linux/include -I../../kernel/linux/arch/arm64/include \
              -I../../kernel/linux/tools/arch/arm64/include \
              legacy-abi-test.c -o legacy-abi-test.o
            ${TARGET_COMPILE}gcc -r -o legacy-abi-test.kpm legacy-abi-test.o
          )
          /tmp/kptools-abi/kptools -l -M kpms/demo-hello/legacy-abi-test.kpm | tee /tmp/kpm-legacy.txt
          grep -Fxq 'version=1.0.0' /tmp/kpm-legacy.txt
          ! grep -q '^abi=' /tmp/kpm-legacy.txt
          echo 'ABI 1 and legacy KPM both parsed without changing load signatures.'

      - name: Verify ABI compatibility symbol
        shell: bash
        run: |
          set -euo pipefail
          /tmp/kp-toolchain/bin/aarch64-none-elf-nm -a kernel/kpimg.elf \
            | grep -F '__kp_symbol_is_su_allow_uid' > /dev/null
          echo 'Legacy is_su_allow_uid export is present.'
          sha256sum kernel/kpimg

      - name: Upload patched KPIMG (test artifact only; not flashable)
        uses: actions/upload-artifact@v4
        with:
          name: kpimg-nohello-abi-${{ github.run_number }}
          path: kernel/kpimg
          if-no-files-found: error
          retention-days: 30
